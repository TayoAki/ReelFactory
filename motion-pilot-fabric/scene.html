const narration={"voice": "Microsoft Edge en-US-JennyNeural; synthetic preview narration", "segments": [{"start": 0, "duration": 5.16, "text": "A Store is an entity type: a definition of something the business cares about.", "words": [{"type": "WordBoundary", "offset": 1020830, "duration": 1302080, "text": "A"}, {"type": "WordBoundary", "offset": 2453330, "duration": 2604160, "text": "Store"}, {"type": "WordBoundary", "offset": 5187500, "duration": 1302080, "text": "is"}, {"type": "WordBoundary", "offset": 6620000, "duration": 1302080, "text": "an"}, {"type": "WordBoundary", "offset": 8052080, "duration": 3255410, "text": "entity"}, {"type": "WordBoundary", "offset": 11437500, "duration": 4036660, "text": "type"}, {"type": "WordBoundary", "offset": 17687500, "duration": 651250, "text": "a"}, {"type": "WordBoundary", "offset": 18468750, "duration": 5859580, "text": "definition"}, {"type": "WordBoundary", "offset": 24458330, "duration": 781250, "text": "of"}, {"type": "WordBoundary", "offset": 25370000, "duration": 3385410, "text": "something"}, {"type": "WordBoundary", "offset": 28885410, "duration": 1041660, "text": "the"}, {"type": "WordBoundary", "offset": 30057500, "duration": 4166660, "text": "business"}, {"type": "WordBoundary", "offset": 34354160, "duration": 2995000, "text": "cares"}, {"type": "WordBoundary", "offset": 37479160, "duration": 4947910, "text": "about"}]}, {"start": 5.71, "duration": 3.024, "text": "Region and priority are properties.", "words": [{"type": "WordBoundary", "offset": 1020830, "duration": 3906250, "text": "Region"}, {"type": "WordBoundary", "offset": 5057500, "duration": 1041660, "text": "and"}, {"type": "WordBoundary", "offset": 6229160, "duration": 5468750, "text": "priority"}, {"type": "WordBoundary", "offset": 11828330, "duration": 1172080, "text": "are"}, {"type": "WordBoundary", "offset": 13130410, "duration": 8072910, "text": "properties"}]}, {"start": 9.283999999999999, "duration": 5.448, "text": "Store operates Refrigeration , "text": "ontology"}, {"type": "WordBoundary", "offset": 49609580, "duration": 5338750, "text": "supplies"}, {"type": "WordBoundary", "offset": 55078330, "duration": 3515830, "text": "meaning"}, {"type": "WordBoundary", "offset": 58724160, "duration": 1041660, "text": "and"}, {"type": "WordBoundary", "offset": 59895830, "duration": 6510410, "text": "mappings"}, {"type": "WordBoundary", "offset": 68099160, "duration": 1041660, "text": "the"}, {"type": "WordBoundary", "offset": 69270830, "duration": 2995000, "text": "data"}, {"type": "WordBoundary", "offset": 72395830, "duration": 3515830, "text": "stays"}, {"type": "WordBoundary", "offset": 76041660, "duration": 911660, "text": "in"}, {"type": "WordBoundary", "offset": 77083330, "duration": 1562500, "text": "its"}, {"type": "WordBoundary", "offset": 78776250, "duration": 5989580, "text": "source"}]}], "duration": 25.716};const duration=narration.duration;

const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const smooth=(t,a,d)=>ease((t-a)/d);const el=id=>document.getElementById(id);
function appear(id,t,a,d=.65,dy=16){const v=smooth(t,a,d);el(id).style.opacity=v;el(id).style.transform=`translateY(${dy*(1-v)}px)`;return v}
window.renderAt=function(t){
 const intro=smooth(t,.15,.65);let scale=1;if(t<.8)scale=.91+.105*intro;else if(t<1.15)scale=1.015-.015*smooth(t,.8,.35);el('store').style.opacity=intro;el('store').style.transform=`scale(${scale})`;

};window.renderAt(0);
if(new URLSearchParams(location.search).has('play')){document.body.classList.add('preview');const audio=el('audio');el('play').onclick=()=>{if(audio.paused){if(audio.currentTime>=duration-.1)audio.currentTime=0;audio.play()}else audio.pause()};function tick(){renderAt(audio.currentTime);el('clock').textContent=audio.currentTime.toFixed(1)+' / '+duration.toFixed(1);requestAnimationFrame(tick)}tick()}
